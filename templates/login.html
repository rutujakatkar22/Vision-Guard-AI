<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision Guard AI </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 350px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    padding: 30px;
    color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
}

.container h2 {
    margin-bottom: 20px;
}

.input-box {
    margin: 15px 0;
    text-align: left;
}

.input-box label {
    font-size: 14px;
}

.input-box input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    margin-top: 5px;
    outline: none;
}

.btn {
    width: 100%;
    padding: 10px;
    background: #00c6ff;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #0072ff;
}

.error {
    color: #ff4d4d;
    margin-top: 10px;
    display: none;
}

.footer {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔐 Vision Guard AI </h2>

    <div class="input-box">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
    </div>

    <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
    </div>

    <button class="btn" onclick="login()">Login</button>

    <div class="error" id="errorMsg">Invalid Credentials!</div>

    <div class="footer">
        Surveillance Management System
    </div>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    fetch("/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `username=${user}&password=${pass}`
    })
    .then(res => {
        if (res.redirected) {
            window.location.href = res.url;
        } else {
            showError("Invalid Credentials!");
        }
    });
}

function showError(msg) {
    let error = document.getElementById("errorMsg");
    error.innerText = msg;
    error.style.display = "block";
}
</script>

</body>
</html>
